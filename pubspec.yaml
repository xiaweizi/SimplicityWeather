name: flutter_dynamic_weather
description: A simple and beautiful Flutter weather app.
publish_to: 'none'

version: 3.0.0+30

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # 本地存储 / 网络
  shared_preferences: ^2.3.5
  dio: ^5.7.0

  # 定位 & 权限
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI 组件
  flutter_slidable: ^3.1.2
  flutter_screenutil: ^5.9.3
  modal_bottom_sheet: ^3.0.0
  path_drawing: ^1.0.1
  fluttertoast: ^8.2.10

  # 工具
  event_bus: ^2.0.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  ota_update: ^6.0.0
  flutter_tts: ^4.2.0

  # 天气背景动画插件
  flutter_weather_bg: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ic_launcher.png

    - assets/images/carWashing.png
    - assets/images/coldRisk.png
    - assets/images/comfort.png
    - assets/images/dressing.png
    - assets/images/ultraviolet.png

    - assets/images/error.png
    - assets/images/empty.png
    - assets/images/caiyun.png
    - assets/images/typhoon.png
    - assets/images/play.png

    - assets/images/weather/
